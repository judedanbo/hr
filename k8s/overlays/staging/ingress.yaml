apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    # This is the staging fix. The live `hr-test-ingress` lists only
    # hr.audit.gov.gh in its tls block, so test-hr.audit.gov.gh is served
    # ingress-nginx's default self-signed certificate and every browser
    # (and curl) rejects it.
    cert-manager.io/cluster-issuer: infosys-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: test-hr.audit.gov.gh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - test-hr.audit.gov.gh
      secretName: hrmis-staging-tls
