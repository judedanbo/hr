apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hr
namePrefix: hrmis-test-

resources:
  - ../../base
  - ingress.yaml

# See the production overlay: without an instance label in the selectors, the
# two environments sharing the `hr` namespace would cross-wire.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: hrmis-test

configMapGenerator:
  - name: app-config
    envs:
      - app.env

replicas:
  - name: app
    count: 1
  - name: web
    count: 1

patches:
  - target:
      kind: Deployment
      labelSelector: hrmis.audit.gov.gh/app-env=true
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: hrmis-test-app-secret

  - path: patch-storage.yaml
