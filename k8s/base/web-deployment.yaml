apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: nginx
          image: hrmis/nginx
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Deliberately NOT the app ConfigMap/Secret: nginx has no business
          # holding database or mail credentials.
          env:
            - name: NGINX_CLIENT_MAX_BODY_SIZE
              value: 100m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Production, 10-17 Nov 2026 (managed Prometheus): CPU max under 1m; memory max 9Mi.
          # Requests cut to match (infosys cluster cost item #10); limits unchanged.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
