apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  labels:
    app.kubernetes.io/component: queue
    hrmis.audit.gov.gh/app-env: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/component: queue
    spec:
      # terminationGracePeriod must exceed --max-time so a worker finishing a
      # long export is not killed mid-job during a rollout.
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: hrmis/php-fpm
          imagePullPolicy: IfNotPresent
          # args, not command: overriding command would bypass the image
          # entrypoint that warms the config/route/view caches.
          args:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
            - --max-jobs=500
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "artisan queue:work" > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
