apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/component: scheduler
    hrmis.audit.gov.gh/app-env: "true"
spec:
  # Exactly one: two schedulers would run every task twice.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: hrmis/php-fpm
          imagePullPolicy: IfNotPresent
          # args, not command — see queue-deployment.yaml.
          args:
            - php
            - artisan
            - schedule:work
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "artisan schedule:work" > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
