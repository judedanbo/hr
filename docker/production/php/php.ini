; Production PHP settings for HRMIS.
; The live deployment set upload limits through nginx's fastcgi_param PHP_VALUE;
; they belong here instead, where php-fpm and the CLI (queue worker, scheduler,
; migrations) all pick them up.

memory_limit = 512M
max_execution_time = 300

upload_max_filesize = 100M
post_max_size = 100M

expose_php = Off

; Logs belong on stderr so kubectl logs shows them.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

date.timezone = UTC
