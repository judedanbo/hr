[www]
; No user/group directives: the container already runs as the hrmis user via
; USER in the Dockerfile, and php-fpm logs a NOTICE that it ignores them when
; it is not started as root.
;
; Comments here must use ';' — php-fpm's parser rejects '#' and fails to boot.

listen = 0.0.0.0:9000

; Consumed by the Kubernetes readiness probe through cgi-fcgi.
ping.path     = /ping
ping.response = pong

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Without this, php-fpm strips the container environment from its workers and
; anything still reading env() at runtime would see nothing.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
